# Render Blueprint: deploys the MCP server (server/) as a free web service.
services:
  - type: web
    name: cgpa-mcp
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
